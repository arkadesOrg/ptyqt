name: Windows Qt6 Build

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Disable Python App Alias
        run: |
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\App Paths\python.exe" /f 2>nul || true
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\App Paths\python3.exe" /f 2>nul || true
          echo "Python aliases disabled (or already absent)"
        shell: cmd
  
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'                  # important
          cache: true
          setup-python: false   # helps with the python.exe permission issue

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
