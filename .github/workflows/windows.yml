name: Windows Qt6 Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            & 'C:\vcpkg\bootstrap-vcpkg.bat'
          }

      - name: Install Windows dependencies
        shell: pwsh
        run: '& C:\vcpkg\vcpkg.exe install winpty:x64-windows bzip2:x64-windows zlib:x64-windows pcre2[core]:x64-windows double-conversion:x64-windows'

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DNO_BUILD_EXAMPLES=1 -DNO_BUILD_TESTS=0

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --verbose
